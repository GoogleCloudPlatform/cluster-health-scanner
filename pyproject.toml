[build-system]
requires = ["setuptools>=61.0", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project]
name = "chs"
version = "0.1.0"
description = "CHS provides a comprehensive suite of tools for validating the health and performance of Accelerators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0,<9.0.0",
    "ramble @ git+https://github.com/GoogleCloudPlatform/ramble.git@fbe8ae277e411ffc3e87b8069529a223e62c6a9e",  # May 13, 2026
    "platformdirs>=3.0.0,<5.0.0",
    "protobuf>=4.21.0",
    "rich>=13.0.0",
    "questionary>=2.0.0,<3.0.0",
    "pre-commit>=3.5.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-compute>=1.14.0,<2.0.0",
    "pyOpenSSL<24.1.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pyyaml",
    "coverage",
]

[project.scripts]
chs = "chs.main:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"chs" = ["**/*.yaml", "**/*.tpl", "**/*.html", "repos/applications/**", "repos/workflow_managers/**", "repos/modifiers/**"]

[tool.coverage.run]
source = ["chs"]
omit = [
    "*_pb2.py",
    "src/chs/protos/*",
]

[tool.ruff]
exclude = [
    # Version control
    ".git",

    # Caches
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",

    # Virtual environments
    ".venv",
    "venv",

    # Build artifacts
    "build",
    "dist",

    # Auto-generated files
    "*_pb2.py",

    # Test snapshots
    "tests/integration/goldens",
]

# Same as Black.
line-length = 80
indent-width = 4

# Support Python 3.10.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E7", "E9", "F", "E501"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ramble repos use star imports and special DSLs that Ruff doesn't fully understand.
# We only want basic lint checks like trailing whitespace here.
"src/chs/repos/**" = ["E402", "F403", "F405", "E501"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
