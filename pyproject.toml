[build-system]
requires = ["setuptools>=61.0", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project]
name = "chs"
version = "0.5.0"
description = "CHS provides a comprehensive suite of tools for validating the health and performance of Accelerators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "ramble @ git+https://github.com/GoogleCloudPlatform/ramble.git@1ebc5346c9dc9e3d023941bacdd79a03641e71ee",  # Jul 01, 2026
    "platformdirs",
    "protobuf",
    "rich",
    "questionary",
    "pre_commit",
    "google-cloud-storage",
    "google-cloud-compute",
    "pyOpenSSL<24.1.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pyyaml",
]

[project.scripts]
chs = "chs.main:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"chs" = ["**/*.yaml", "**/*.tpl", "repos/applications/**", "repos/workflow_managers/**", "repos/modifiers/**"]

[tool.ruff]
exclude = [
    # Version control
    ".git",

    # Caches
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",

    # Virtual environments
    ".venv",
    "venv",

    # Build artifacts
    "build",
    "dist",

    # Auto-generated files
    "*_pb2.py",

    # Test snapshots
    "tests/integration/goldens",
]

# Same as Black.
line-length = 80
indent-width = 4

# Support Python 3.10.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E7", "E9", "F", "E501"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ramble repos use star imports and special DSLs that Ruff doesn't fully understand.
# We only want basic lint checks like trailing whitespace here.
"src/chs/repos/**" = ["E402", "F403", "F405", "E501"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
