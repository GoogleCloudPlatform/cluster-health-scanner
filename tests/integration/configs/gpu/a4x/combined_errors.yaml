cluster_name: chs-kind-cluster
project: chs-test-project
default_zone: us-east5-c
dependencies:
  jobset:
    version: v0.6.0
  kueue:
    version: v0.14.5
  gke_multinetwork:
    enabled: true
nodepools:
- name: gpu-a4x-pool-01
  count: 4
  machine_type: a4x-highgpu-4g
  accelerator: nvidia-gpu
  zone: us-east5-c
  health:
    ready_count: 4
    unschedulable_count: 0
    busy_count: 0
test_scenarios:
- nodepool: gpu-a4x-pool-01
  node_index: 0
  test: gemm
  outcome: DEGRADED
  metrics:
    Throughput: 20000.0
- test: nccl-pairwise
  outcome: DEGRADED
  degraded_links:
    - source:
        nodepool: gpu-a4x-pool-01
        node_index: 0
      target:
        nodepool: gpu-a4x-pool-01
        node_index: 1
      metrics:
        Bandwidth: 200.0
