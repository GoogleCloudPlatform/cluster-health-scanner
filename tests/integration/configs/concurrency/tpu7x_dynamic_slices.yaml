cluster_name: "chs-kind-cluster"
project: "chs-test-project"
default_zone: "us-central1-a"

dependencies:
  gke_multinetwork:
    enabled: true
  tpu_slice:
    crd_name: slices.accelerator.gke.io
    manifest: crd_tpu_slice.yaml

nodepools:
  - name: "tpu-v7-dynamic-01"
    count: 2
    machine_type: "tpu7x-standard-4t"
    accelerator: "tpu7x"
    gke_accelerator_topology_mode: "PROVISION_ONLY"
    partition_topology: "4x4x4"
    partition_id: "partition-01"
    zone: "us-central1-a"
    health:
      ready_count: 2
      unschedulable_count: 0
      busy_count: 0

  - name: "tpu-v7-dynamic-02"
    count: 2
    machine_type: "tpu7x-standard-4t"
    accelerator: "tpu7x"
    gke_accelerator_topology_mode: "PROVISION_ONLY"
    partition_topology: "4x4x4"
    partition_id: "partition-02"
    zone: "us-central1-a"
    health:
      ready_count: 2
      unschedulable_count: 0
      busy_count: 0

test_scenarios: []
