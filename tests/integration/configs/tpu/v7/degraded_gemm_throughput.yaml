cluster_name: chs-kind-cluster
project: chs-test-project
default_zone: us-central1-a
dependencies:
  jobset:
    version: v0.6.0
  kueue:
    version: v0.14.5
  gke_multinetwork:
    enabled: true
nodepools:
- name: tpu-v7-pool-01
  count: 4
  machine_type: tpu7x-standard-4t
  accelerator: tpu-v7x-slice
  topology: 2x2x4
  zone: us-central1-a
  health:
    ready_count: 4
    unschedulable_count: 0
    busy_count: 0
test_scenarios:
- nodepool: tpu-v7-pool-01
  node_index: 0
  test: tpu-gemm
  outcome: DEGRADED
  metrics:
    TFLOPS: 120.0
