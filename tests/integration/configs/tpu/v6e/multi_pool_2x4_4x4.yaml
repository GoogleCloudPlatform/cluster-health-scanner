cluster_name: chs-kind-cluster
project: chs-test-project
default_zone: us-east5-c
dependencies:
  gke_multinetwork:
    enabled: true
nodepools:
- name: tpu-v6e-pool-01
  count: 2
  machine_type: ct6e-standard-4t
  accelerator: tpu-v6e-slice
  topology: 2x4
  zone: us-east5-c
  health:
    ready_count: 2
    unschedulable_count: 0
    busy_count: 0
- name: tpu-v6e-pool-02
  count: 4
  machine_type: ct6e-standard-4t
  accelerator: tpu-v6e-slice
  topology: 4x4
  zone: us-east5-c
  health:
    ready_count: 2
    unschedulable_count: 0
    busy_count: 0
test_scenarios: []
