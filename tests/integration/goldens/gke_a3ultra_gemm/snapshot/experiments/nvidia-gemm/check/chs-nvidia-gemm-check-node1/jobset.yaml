apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-nvidia-gemm-check-<HASH>
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 2400
          template:
            metadata:

              annotations:
                networking.gke.io/default-interface: eth0
                networking.gke.io/interfaces: |
                  [{"interfaceName": "eth0", "network": "default"}, {"interfaceName": "eth1", "network": "gpu-net-1"}]
            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: a3-ultragpu-8g
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "nvidia.com/gpu"
                  operator: "Exists"
                  effect: "NoSchedule"
              volumes:
                - name: shared-memory
                  emptyDir:
                    medium: "Memory"
              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "nvcr.io/nvidia/hpc-benchmarks:25.09"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    nvidia.com/gpu: 8
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/nvidia-gemm/check/chs-nvidia-gemm-check-node1"
                  mkdir -p "/workspace/microbenchmarks"
                  cd "/workspace/microbenchmarks"
                  rm -f "<WORKSPACE_ROOT>/experiments/nvidia-gemm/check/chs-nvidia-gemm-check-node1/chs-nvidia-gemm-check-node1.out"
                  touch "<WORKSPACE_ROOT>/experiments/nvidia-gemm/check/chs-nvidia-gemm-check-node1/chs-nvidia-gemm-check-node1.out"
                  nvidia-smi -pm 1 || true
                  mpirun --allow-run-as-root -n 8 -x CUDA_VISIBLE_DEVICES ./gemm_tests.sh --gpu-affinity 0:1:2:3:4:5:6:7 --cpu-affinity 0-55:0-55:0-55:0-55:56-111:56-111:56-111:56-111 --mem-affinity 0:0:0:0:1:1:1:1 --params "--mode=check --type=fp64 --m=16384 --n=16384 --k=16384 --iter=32" | tee <WORKSPACE_ROOT>/experiments/nvidia-gemm/check/chs-nvidia-gemm-check-node1/chs-nvidia-gemm-check-node1_local.out 
                  mpirun --allow-run-as-root -n 8 -x CUDA_VISIBLE_DEVICES sh -c 'RANK="${SLURM_PROCID:-${OMPI_COMM_WORLD_RANK:-0}}"; if [ "$RANK" -eq 0 ]; then ./gemm_parse_results.sh --correctness --list --stats <WORKSPACE_ROOT>/experiments/nvidia-gemm/check/chs-nvidia-gemm-check-node1/chs-nvidia-gemm-check-node1_local.out; fi' 
                volumeMounts:
                  - name: shared-memory
                    mountPath: /dev/shm
              restartPolicy: Never

