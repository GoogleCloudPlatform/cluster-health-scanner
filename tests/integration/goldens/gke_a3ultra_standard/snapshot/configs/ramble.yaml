ramble:
  variants:
    workflow_manager: gke_jobset
  config:
    overwrite_inventories: True
  variables:
    scheduler: gke
    nodes:
    - node1
    - node2
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: a3-ultra
    tests:
    - name: nvidia-smi
    - name: dcgm
      variables:
        diag_level:
        - 3
    - name: stream
    - name: nccl-cluster
      workloads:
      - all-gather
      - all-reduce
      - all-to-all
      variables:
        begin_message_size: 256M
        end_message_size: 8G
    - name: nccl-pairwise
      workloads:
      - all-gather
      - all-reduce
      - all-to-all
      variables:
        begin_message_size: 256M
        end_message_size: 8G
    default_interface_name: eth0
    all_interfaces_json: '[{"interfaceName": "eth0", "network": "default"}, {"interfaceName":
      "eth1", "network": "gpu-net-1"}]'
    timeout: 900
    deadline: 3000
    jobset_labels_yaml: 'kueue.x-k8s.io/queue-name: chs-local-queue'
    suspend_jobset: 'true'
  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            chs:
              variables:
                placeholder: 'true'
