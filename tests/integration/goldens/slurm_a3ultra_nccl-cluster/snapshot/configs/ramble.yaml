ramble:
  variants:
    workflow_manager: slurm
  config:
    overwrite_inventories: True
  variables:
    chs_run_id: dry-run-cluster-custom-mock
    nodes:
    - node1
    - node2
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: a3-ultragpu-8g
    tests:
    - name: nccl-cluster
    scheduler: slurm
    container_dir: <APP_DATA_DIR>/images
    tcp_interfaces: enp0s1,enp0s2
    timeout: 1200
    deadline: 4200
  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            chs:
              variables:
                placeholder: 'true'
