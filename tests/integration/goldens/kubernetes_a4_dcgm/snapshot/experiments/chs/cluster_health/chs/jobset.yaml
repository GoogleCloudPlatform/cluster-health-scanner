apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dry-run-cluster-custom-mock-chs-cluster-<HASH>
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 4200
          template:
            metadata:


            spec:
              restartPolicy: Never




              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: ""


                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/chs/cluster_health/chs"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/chs/cluster_health/chs"
                  cd "<WORKSPACE_ROOT>/experiments/chs/cluster_health/chs"
                  rm -f "<WORKSPACE_ROOT>/experiments/chs/cluster_health/chs/chs.out"
                  touch "<WORKSPACE_ROOT>/experiments/chs/cluster_health/chs/chs.out"
                  echo 'Initiating cluster health diagnostics for a4-highgpu-8g' 

              restartPolicy: Never

