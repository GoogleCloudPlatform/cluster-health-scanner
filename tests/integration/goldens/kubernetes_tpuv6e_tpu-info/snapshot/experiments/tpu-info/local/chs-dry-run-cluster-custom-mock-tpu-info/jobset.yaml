apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-custom-mock-tpu-info-<HASH>
  namespace: chs
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 2
          completions: 2
          activeDeadlineSeconds: 1200
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: ct6e-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                            - node2
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-dry-run-cluster-custom-mock-tpu-info"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-dry-run-cluster-custom-mock-tpu-info"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-dry-run-cluster-custom-mock-tpu-info"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-dry-run-cluster-custom-mock-tpu-info/chs-dry-run-cluster-custom-mock-tpu-info.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-dry-run-cluster-custom-mock-tpu-info/chs-dry-run-cluster-custom-mock-tpu-info.out"
                  echo '' | base64 -d > tpu_inventory.py 
                  python3 tpu_inventory.py 

              restartPolicy: Never

