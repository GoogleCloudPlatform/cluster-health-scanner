
apiVersion: v1
kind: Secret
metadata:
  name: chs-dry-run-cluster-lite-mock-nccl-singl-<HASH>-ssh
  namespace: chs
type: Opaque
stringData:
  ssh-privatekey: |
    <SCRUBBED_PRIVATE_KEY>
  ssh-publickey: |
    ssh-ed25519 <SCRUBBED_KEY>
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-lite-mock-nccl-singl-<HASH>
  namespace: chs
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 4200
          template:
            metadata:

              annotations:
                networking.gke.io/default-interface: eth0
                networking.gke.io/interfaces: |
                  [{"interfaceName": "eth0", "network": "default"}, {"interfaceName": "eth1", "network": "gpu-net-1"}]
            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: a3-ultragpu-8g
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "nvidia.com/gpu"
                  operator: "Exists"
                  effect: "NoSchedule"


              volumes:
              - name: mpi-id
                secret:
                  secretName: chs-dry-run-cluster-lite-mock-nccl-singl-<HASH>-ssh
                  items:
                  - key: ssh-privatekey
                    path: "id_rsa"
                  - key: ssh-publickey
                    path: "id_rsa.pub"
              - name: shared-memory
                emptyDir:
                  medium: "Memory"
              containers:
              - name: mpi-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic:v1.1.0"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    nvidia.com/gpu: 8
                env:
                - name: OMPI_ALLOW_RUN_AS_ROOT
                  value: "1"
                - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                  value: "1"
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export DEBIAN_FRONTEND=noninteractive
                  mkdir -p /run/sshd ~/.ssh
                  chmod 700 ~/.ssh
                  cp /secrets/ssh/* ~/.ssh/
                  cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
                  chmod 600 ~/.ssh/*
                  /sbin/sshd -p 222

                  if [ -x /sbin/ldconfig ]; then /sbin/ldconfig; fi

                  export POD_NAME=$(hostname -s)
                  export JOBSET_NAME=${POD_NAME%-w-0-*}
                  export NODE_RANK=$JOB_COMPLETION_INDEX

                  mkdir -p "<WORKSPACE_ROOT>/experiments/nccl-tests/all-gather/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/nccl-tests/all-gather/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1"
                  cd "<WORKSPACE_ROOT>/experiments/nccl-tests/all-gather/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1"

                  if [[ "$JOB_COMPLETION_INDEX" -eq "0" ]]; then
                    echo "Discovering hosts..."
                    for i in $(seq 0 $(( 1 - 1 ))); do
                      OTHER="${JOBSET_NAME}-w-0-${i}.${JOBSET_NAME}"
                      until ssh -p 222 -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 $OTHER true; do
                        echo "Waiting for $OTHER to become available..."
                        sleep 5
                      done
                      echo "${OTHER} slots=8" >> /tmp/hostfile
                    done


                    echo "--- STARTING MPI EXECUTION ---"
                    rm -f "<WORKSPACE_ROOT>/experiments/nccl-tests/all-gather/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1.out"
                    touch "<WORKSPACE_ROOT>/experiments/nccl-tests/all-gather/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1/chs-dry-run-cluster-lite-mock-nccl-single-node-all-gather-node1.out"
                    export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7;
                    export NCCL_DEBUG=INFO;
                    export NCCL_NET=Socket;
                    export NCCL_TESTS_SPLIT_MASK="";
                    export OMPI_ALLOW_RUN_AS_ROOT=1;
                    if [ -d "/usr/local/gib/scripts" ]; then
                        NCCL_LIB_DIR=/usr/local/gib/scripts . /usr/local/gib/scripts/set_nccl_env.sh
                    fi
                    nvidia-smi -pm 1 || true
                    mpirun -n 8 -N 8 \
                      --hostfile /tmp/hostfile --bind-to none \
                      --mca btl self,tcp --mca btl_tcp_if_include eth0 \
                      --mca orte_keep_fqdn_hostnames 1 --mca plm_rsh_no_tree_spawn 1 \
                      --mca plm_rsh_agent "ssh -q -p 222 -o StrictHostKeyChecking=no -o BatchMode=yes" \
                      -x CUDA_VISIBLE_DEVICES \
                      -x PATH="/third_party/nccl-tests/build:$PATH" \
                      -x $(echo ${!NCCL*} ${!OMPI*} LD_LIBRARY_PATH | sed 's/ / -x /g') all_gather_perf -b 256M -e 8G -f 2 -g 1 -w 5 --iters 100 -c 1 
                    EXIT_CODE=$?
                    echo "--- END MPI EXECUTION ---"

                    exit $EXIT_CODE
                  else
                    echo "Worker started. Idling while launcher coordinates..."
                    HEAD_NODE="${JOBSET_NAME}-w-0-0.${JOBSET_NAME}"

                    # Wait for head node to become reachable
                    echo "Waiting for head node ${HEAD_NODE} to become reachable..."
                    while ! (echo > /dev/tcp/$HEAD_NODE/222) 2>/dev/null; do
                      sleep 5
                    done

                    echo "Head node is up. Idling until it finishes..."
                    # Once reachable, stay alive as long as it replies
                    while (echo > /dev/tcp/$HEAD_NODE/222) 2>/dev/null; do
                      sleep 5
                    done

                    echo "Head node is no longer reachable. Worker terminating."
                  fi
                volumeMounts:
                - name: mpi-id
                  mountPath: "/secrets/ssh"
                  readOnly: true
                - name: shared-memory
                  mountPath: /dev/shm
              restartPolicy: Never

