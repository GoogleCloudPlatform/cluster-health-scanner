apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-custom-mock-dcgm-lev-<HASH>
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 4200
          template:
            metadata:

              annotations:
                compute-domain.nvidia.com/channel-claim-template: chs-dry-run-cluster-custom-mock-dcgm-lev-<HASH>-compute-domain-channel
                compute-domain.nvidia.com/domain-name: chs-dry-run-cluster-custom-mock-dcgm-lev-<HASH>-compute-domain
                networking.gke.io/default-interface: eth0
                networking.gke.io/interfaces: |
                  [{"interfaceName": "eth0", "network": "default"}, {"interfaceName": "eth1", "network": "gpu-net-1"}]
            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: a4x-maxgpu-4g-metal
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: nvidia.com/gpu
                  operator: Equal
                  value: present
                  effect: NoSchedule
                - key: kubernetes.io/arch
                  operator: Equal
                  value: arm64
                  effect: NoSchedule
              volumes:
                - name: shared-memory
                  emptyDir:
                    medium: "Memory"
              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "nvcr.io/nvidia/cloud-native/dcgm:4.5.1-1-ubi9"
                securityContext:
                  privileged: true
                  runAsUser: 0
                resources:
                  limits:
                    nvidia.com/gpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/nvidia-dcgm/diag/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/nvidia-dcgm/diag/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1"
                  cd "<WORKSPACE_ROOT>/experiments/nvidia-dcgm/diag/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1"
                  rm -f "<WORKSPACE_ROOT>/experiments/nvidia-dcgm/diag/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1.out"
                  touch "<WORKSPACE_ROOT>/experiments/nvidia-dcgm/diag/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1/chs-dry-run-cluster-custom-mock-dcgm-level-2-node1.out"
                  nvidia-smi -pm 1 || true
                  dcgmi diag -r 2 
                volumeMounts:
                  - name: shared-memory
                    mountPath: /dev/shm
              restartPolicy: Never

