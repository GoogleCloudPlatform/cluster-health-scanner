apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-custom-mock-tpu-host-<HASH>
  namespace: chs
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 4200
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: ct6e-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node2
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2/chs-dry-run-cluster-custom-mock-tpu-host-device-node2.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2/chs-dry-run-cluster-custom-mock-tpu-host-device-node2.out"
                  printf '%b' 'benchmarks:\n- benchmark_name: host_device\n  num_runs: 20\n  benchmark_sweep_params:\n  - {\n      data_size_mib_list: [1, 16, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]\n    }\n  csv_path: "../microbenchmarks/host_device"\n  trace_dir: "../microbenchmarks/host_device/trace"' | tee <WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2/chs_tpu_host_device.yaml 
                  export TPU_HOST_BOUNDS=1,1,1 && export HOST_BOUNDS=1,1,1 && export TPU_TOPOLOGY=2x2x1 && export TPU_ACCELERATOR_TYPE=v6e-4 &&  python3 -u /app/accelerator-microbenchmarks/Ironwood/src/run_benchmark.py --config <WORKSPACE_ROOT>/experiments/tpu-host-device/check/chs-dry-run-cluster-custom-mock-tpu-host-device-node2/chs_tpu_host_device.yaml 2>&1 

              restartPolicy: Never

