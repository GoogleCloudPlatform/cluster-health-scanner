ramble:
  variants:
    workflow_manager: kubernetes-jobset
  config:
    overwrite_inventories: True
  variables:
    chs_run_id: dry-run-cluster-custom-mock
    scheduler: kubernetes
    nodes:
    - node1
    - node2
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: tpu7x-standard-4t
    tests:
    - name: tpu-collectives
    default_interface_name: eth0
    all_interfaces_json: '[{"interfaceName": "eth0", "network": "default"}]'
    timeout: 1200
    deadline: 4200
    jobset_labels_yaml: 'kueue.x-k8s.io/queue-name: chs-local-queue'
    suspend_jobset: 'true'
    kubernetes_namespace: chs
    tpu_slices:
      default-pool:
      - node1
      - node2
    tpu_slice_topologies:
      default-pool: 2x2x1
  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            chs:
              variables:
                placeholder: 'true'
