apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-custom-mock-tpu-coll-<HASH>
  namespace: chs
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 4200
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: tpu7x-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-collectives/all_gather/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-collectives/all_gather/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-collectives/all_gather/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-collectives/all_gather/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-collectives/all_gather/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1/chs-dry-run-cluster-custom-mock-tpu-collectives-single-node-all_gather-node1.out"
                  export TPU_HOST_BOUNDS=1,1,1 && export HOST_BOUNDS=1,1,1 && export TPU_TOPOLOGY=2x2x1 && export TPU_ACCELERATOR_TYPE=tpu7x-8 && cd /app/accelerator-microbenchmarks && printf "%b" "benchmarks:\n- benchmark_name: all_gather\n  benchmark_sweep_params:\n  - {matrix_dim_range: {start: 8, end: 16384, multiplier: 2}, dtype: "float32", mesh_shape: "4x2x1", ici_size_range: 8, sharding_strategy: "4x2x1", op_dimension: 1, num_runs: 20}\n  trace_dir: "../microbenchmarks/collectives/all_gather"\n  csv_path: "../microbenchmarks/collectives/all_gather"\n  xlml_metrics_dir: "../microbenchmarks/collectives/all_gather"\n  xla_dump_dir: "../microbenchmarks/collectives/all_gather/hlo_graphs"" > Ironwood/configs/chs_tpu_collectives.yaml && python3 Ironwood/src/run_benchmark.py --config Ironwood/configs/chs_tpu_collectives.yaml 2>&1 

              restartPolicy: Never

