ramble:
  variants:
    workflow_manager: gke_jobset
  config:
    overwrite_inventories: True
  variables:
    scheduler: gke
    nodes: ["node1", "node2"]
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: a3-mega
    tests: [{"name": "stream"}]
    default_interface_name: eth0
    all_interfaces_json: |
      [{"interfaceName": "eth0", "network": "default"}, {"interfaceName": "eth1", "network": "gpu-net-1"}]

  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            cluster_health_diagnostics:
              variables:
                placeholder: "true"
