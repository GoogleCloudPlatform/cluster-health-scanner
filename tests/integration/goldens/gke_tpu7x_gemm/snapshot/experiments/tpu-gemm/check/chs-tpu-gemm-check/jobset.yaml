apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-tpu-gemm-check-<HASH>
  namespace: default


spec:
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 2
          completions: 2
          activeDeadlineSeconds: 2400
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: tpu7x-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                            - node2
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-gemm/check/chs-tpu-gemm-check"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-gemm/check/chs-tpu-gemm-check"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-gemm/check/chs-tpu-gemm-check"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-gemm/check/chs-tpu-gemm-check/chs-tpu-gemm-check.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-gemm/check/chs-tpu-gemm-check/chs-tpu-gemm-check.out"
                  cd /app/accelerator-microbenchmarks && \ 
                  printf "%b" "benchmarks:\n- benchmark_name: gemm_multiple_run\n  trace_dir: \"../microbenchmarks/gemm_multiple_run_bf16\"\n  csv_path: \"../microbenchmarks/gemm_multiple_run_bf16\"\n  xlml_metrics_dir: \"../microbenchmarks/gemm_multiple_run_bf16\"\n  xla_dump_dir: \"../microbenchmarks/gemm_multiple_run_bf16/hlo_graphs\"\n  benchmark_sweep_params:\n  - {m: 16384, k: 16384, n: 16384, num_runs: 100, dtype: 'bfloat16'}\n" > Ironwood/configs/chs_tpu_gemm.yaml && \ 
                  python3 Ironwood/src/run_benchmark.py --config Ironwood/configs/chs_tpu_gemm.yaml 2>&1 | sed "s/^/[$MY_NODE_NAME] /" 

              restartPolicy: Never

