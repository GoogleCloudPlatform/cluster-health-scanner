apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-tpu-hbm-<HASH>
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 2400
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: tpu7x-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-tpu-hbm-node1"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-tpu-hbm-node1"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-tpu-hbm-node1"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-tpu-hbm-node1/chs-tpu-hbm-node1.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-tpu-hbm-node1/chs-tpu-hbm-node1.out"
                  export TPU_HOST_BOUNDS=1,1,1 && export HOST_BOUNDS=1,1,1 && export TPU_TOPOLOGY=2x2x1 && export TPU_ACCELERATOR_TYPE=tpu7x-8 && cd /app/accelerator-microbenchmarks && printf '%b' 'benchmarks:\n- benchmark_name: "single_device_hbm_copy"\n  benchmark_sweep_params:\n  - {num_elements_range: {start: 1048576, end: 4294967296, multiplier: 2}, dtype: "bfloat16", num_runs: 20}\n  trace_dir: "../microbenchmarks/hbm_bfloat16"\n  csv_path: "../microbenchmarks/hbm_bfloat16"\n  xlml_metrics_dir: "../microbenchmarks/hbm_bfloat16"\n  xla_dump_dir: "../microbenchmarks/hbm_bfloat16/hlo_graphs"\n' > Ironwood/configs/chs_tpu_hbm.yaml && python3 Ironwood/src/run_benchmark.py --config Ironwood/configs/chs_tpu_hbm.yaml 2>&1 

              restartPolicy: Never

