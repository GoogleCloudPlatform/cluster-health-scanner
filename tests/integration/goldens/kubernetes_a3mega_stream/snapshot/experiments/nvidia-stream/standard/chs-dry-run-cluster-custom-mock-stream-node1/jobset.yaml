apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-custom-mock-stream-<HASH>
  namespace: chs
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 1200
          template:
            metadata:

              annotations:
                networking.gke.io/default-interface: eth0
                networking.gke.io/interfaces: |
                  [{"interfaceName": "eth0", "network": "default"}, {"interfaceName": "eth1", "network": "gpu-net-1"}]
            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: a3-megagpu-8g
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "nvidia.com/gpu"
                  operator: "Exists"
                  effect: "NoSchedule"
              volumes:
                - name: shared-memory
                  emptyDir:
                    medium: "Memory"
                - name: nvidia
                  hostPath:
                    path: /home/kubernetes/bin/nvidia/lib64
                - name: sys
                  hostPath:
                    path: /sys
                - name: proc-sys
                  hostPath:
                    path: /proc/sys
                - name: aperture-devices
                  hostPath:
                    path: /dev/aperture_devices
              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "nvcr.io/nvidia/hpc-benchmarks:25.09"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    nvidia.com/gpu: 8
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/nvidia-stream/standard/chs-dry-run-cluster-custom-mock-stream-node1"
                  mkdir -p "/workspace"
                  cd "/workspace"
                  rm -f "<WORKSPACE_ROOT>/experiments/nvidia-stream/standard/chs-dry-run-cluster-custom-mock-stream-node1/chs-dry-run-cluster-custom-mock-stream-node1.out"
                  touch "<WORKSPACE_ROOT>/experiments/nvidia-stream/standard/chs-dry-run-cluster-custom-mock-stream-node1/chs-dry-run-cluster-custom-mock-stream-node1.out"
                  nvidia-smi -pm 1 || true
                  mpirun --allow-run-as-root -n 8 --tag-output bash -c 'export CUDA_VISIBLE_DEVICES=$OMPI_COMM_WORLD_LOCAL_RANK; exec "$@"' -- ./stream-gpu-test.sh --n 300653184 --gpu-affinity  --cpu-affinity 0-51:0-51:0-51:0-51:52-103:52-103:52-103:52-103 --mem-affinity 0:0:0:0:1:1:1:1 
                volumeMounts:
                  - name: shared-memory
                    mountPath: /dev/shm
                  - name: nvidia
                    mountPath: /usr/local/nvidia/lib64
                  - name: aperture-devices
                    mountPath: /dev/aperture_devices
              restartPolicy: Never

