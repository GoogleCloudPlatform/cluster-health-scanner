apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-tpu-info-<HASH>
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:
  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 2400
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: tpu7x-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-tpu-info-node1"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-tpu-info-node1"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-tpu-info-node1"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-tpu-info-node1/chs-tpu-info-node1.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-info/local/chs-tpu-info-node1/chs-tpu-info-node1.out"
                  TPU_OUT=$(tpu-info) 
                  echo "$TPU_OUT" 
                  echo "TPU Count: $(echo "$TPU_OUT" | grep -c "chip")" 
                  echo "Host Info: $(uname -a)" 

              restartPolicy: Never

