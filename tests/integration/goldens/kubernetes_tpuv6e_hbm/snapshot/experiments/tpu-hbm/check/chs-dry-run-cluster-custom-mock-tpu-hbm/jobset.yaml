apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: chs-dry-run-cluster-custom-mock-tpu-hbm-<HASH>
  namespace: chs
  labels:
    kueue.x-k8s.io/queue-name: chs-local-queue

spec:

  suspend: true
  ttlSecondsAfterFinished: 86400
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: w
      template:
        spec:
          parallelism: 2
          completions: 2
          activeDeadlineSeconds: 1200
          template:
            metadata:


            spec:
              restartPolicy: Never
              nodeSelector:
                node.kubernetes.io/instance-type: ct6e-standard-4t
                cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
                cloud.google.com/gke-tpu-topology: 2x2x1
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                            - node1
                            - node2
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/jobset-name
                        operator: Exists
                    topologyKey: "kubernetes.io/hostname"
              tolerations:
                - key: "google.com/tpu"
                  operator: "Exists"
                  effect: "NoSchedule"

              containers:
              - name: standard-container
                stdin: true
                tty: true
                image: "us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:latest"
                securityContext:
                  privileged: true
                resources:
                  limits:
                    google.com/tpu: 4
                env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                command:
                - bash
                - -c
                - |
                  export NODE_RANK=$JOB_COMPLETION_INDEX
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm"
                  mkdir -p "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm"
                  cd "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm"
                  rm -f "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm/chs-dry-run-cluster-custom-mock-tpu-hbm.out"
                  touch "<WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm/chs-dry-run-cluster-custom-mock-tpu-hbm.out"
                  printf '%b' 'benchmarks:\n- benchmark_name: "single_device_hbm_copy"\n  benchmark_sweep_params:\n  - {num_elements_range: {start: 1048576, end: 2147483648, multiplier: 2}, dtype: "bfloat16", num_runs: 20}\n  trace_dir: "../microbenchmarks/hbm_bfloat16"\n  csv_path: "../microbenchmarks/hbm_bfloat16"\n  xlml_metrics_dir: "../microbenchmarks/hbm_bfloat16"\n  xla_dump_dir: "../microbenchmarks/hbm_bfloat16/hlo_graphs"' | tee <WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm/chs_tpu_hbm.yaml 
                  set -o pipefail;   python3 -u /app/accelerator-microbenchmarks/Ironwood/src/run_benchmark.py --config <WORKSPACE_ROOT>/experiments/tpu-hbm/check/chs-dry-run-cluster-custom-mock-tpu-hbm/chs_tpu_hbm.yaml 2>&1 | sed "s/^/HOST ${MY_NODE_NAME:-$(hostname)}: /" 

              restartPolicy: Never

