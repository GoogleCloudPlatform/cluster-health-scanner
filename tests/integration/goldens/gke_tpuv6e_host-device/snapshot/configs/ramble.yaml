ramble:
  variants:
    workflow_manager: gke_jobset
  config:
    overwrite_inventories: True
  variables:
    scheduler: gke
    nodes:
    - node1
    - node2
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: tpuv6e
    tests:
    - name: host-device
    default_interface_name: eth0
    all_interfaces_json: '[{"interfaceName": "eth0", "network": "default"}]'
    timeout: 600
    deadline: 2400
    tpu_topology: 2x2x1
  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            chs:
              variables:
                placeholder: 'true'
