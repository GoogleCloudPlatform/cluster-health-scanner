exclude: '^(tests/integration/goldens/|\.gemini/).*'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
        exclude: '^helm/'
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
-   repo: local
    hooks:
    -   id: addlicense
        name: addlicense
        entry: addlicense
        language: golang
        additional_dependencies: [github.com/google/addlicense@v1.1.1]
        args: [-c, "Google LLC"]
        types_or: [python, yaml, shell]
    -   id: unittest
        name: unittest
        entry: env PYTHONPATH=src python3 -m unittest discover tests
        language: system
        types: [python]
        pass_filenames: false
