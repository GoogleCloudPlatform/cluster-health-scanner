exclude: "^tests/integration/goldens/.*"
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

-   repo: local
    hooks:
    -   id: unittest
        name: unittest
        entry: env PYTHONPATH=src python3 -m unittest discover tests
        language: system
        types: [python]
        pass_filenames: false
