exclude: '^(tests/integration/goldens/|\.gemini/).*'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
        exclude: '^helm/'
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
    -   id: pip-compile
        name: pip-compile requirements.txt
        args: [pyproject.toml, requirements-build.in, --universal, --python-version=3.12, --generate-hashes, --no-emit-package=ramble, --no-emit-package=accelerator-microbenchmarks, --quiet, --output-file=requirements.txt]
        files: ^(pyproject\.toml|requirements-build\.in|requirements\.txt)$
        pass_filenames: false
    -   id: pip-compile
        name: pip-compile requirements-system.txt
        args: [requirements-system.in, --universal, --python-version=3.12, --generate-hashes, --quiet, --output-file=requirements-system.txt]
        files: ^requirements-system\.(in|txt)$
        pass_filenames: false
-   repo: local
    hooks:
    -   id: addlicense
        name: addlicense
        entry: addlicense
        language: golang
        additional_dependencies: [github.com/google/addlicense@v1.1.1]
        args: [-c, "Google LLC"]
        types_or: [python, yaml, shell]
    -   id: coverage
        name: unit tests and coverage
        entry: bash -c 'env PYTHONPATH=src coverage run -m unittest discover tests && coverage report --fail-under=65'
        language: system
        types: [python]
        pass_filenames: false
