name: PR Target Branch Check

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-target:
    name: Verify Base Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify Base Branch is develop
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$TARGET_BRANCH" != "develop" ]; then
            echo "::error title=Invalid PR Target Branch::Pull requests must target the 'develop' branch, but this PR targets '$TARGET_BRANCH'."
            echo "To fix this:"
            echo "  1. Click 'Edit' at the top of this pull request."
            echo "  2. Change the 'base' branch dropdown from '$TARGET_BRANCH' to 'develop'."
            echo "  3. Click 'Save'."
            exit 1
          fi
          echo "PR correctly targets 'develop'."
