name: release-image
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no internal files in build context
        run: |
          for p in .agents .gemini helm bin cloudbuild.yaml cloudbuild-integration.yaml; do
            if [ -e "$p" ]; then echo "::error::internal path $p present"; exit 1; fi
          done
      - name: Build image (stand-in for Louhi)
        run: docker build -t chs:${GITHUB_REF_NAME} . && docker images chs
