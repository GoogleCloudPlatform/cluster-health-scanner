name: Presubmits

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]

concurrency:
  group: presubmits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go (for addlicense)
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ">=1.21"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Pre-commit Environments
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit uv

      - name: Run Pre-commit Hooks
        run: |
          set +e -o pipefail
          SKIP=coverage pre-commit run --all-files --show-diff-on-failure 2>&1 | tee precommit.log
          PRECOMMIT_EXIT=$?
          echo "### Pre-commit Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat precommit.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $PRECOMMIT_EXIT

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Unit Tests & Verify Coverage
        run: |
          set +e -o pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          env PYTHONPATH=src python -m coverage run -m unittest discover -v tests 2>&1 | tee test.log
          TEST_EXIT=$?
          echo "### Test Execution Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ $TEST_EXIT -ne 0 ]; then
            echo "::error::Unit tests failed! See step summary for details."
            exit $TEST_EXIT
          fi

          python -m coverage report --fail-under=65 2>&1 | tee coverage.log
          COV_EXIT=$?
          echo "### Unit Test Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $COV_EXIT
