schedulers:
- kubernetes
- slurm
variables:
  cpu_affinity: 0-55:0-55:0-55:0-55:56-111:56-111:56-111:56-111
  gpus_per_node: 8
  mem_affinity: 0:0:0:0:1:1:1:1
  n_ranks: '{processes_per_node}*{n_nodes}'
  processes_per_node: '{gpus_per_node}'
kubernetes:
  variables:
    container_resources_yaml: |
      limits:
        nvidia.com/gpu: {gpus_per_node}
      requests:
        nvidia.com/gpu: {gpus_per_node}
    container_security_context_yaml: |
      privileged: true
    extra_volume_mounts_yaml: |
      - name: shared-memory
        mountPath: /dev/shm
    extra_volumes_yaml: |
      - name: shared-memory
        emptyDir:
          medium: "Memory"
    node_selector_yaml: 'node.kubernetes.io/instance-type: a4-highgpu-8g'
    pod_annotations_yaml: |
      networking.gke.io/default-interface: {default_interface_name}
      networking.gke.io/interfaces: |
        {all_interfaces_json}
    tolerations_yaml: |
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
