schedulers:
- kubernetes
- slurm
variables:
  n_ranks: '{processes_per_node}*{n_nodes}'
  processes_per_node: 1
  tpu_chips_per_node: 4
kubernetes:
  variables:
    container_resources_yaml: |
      limits:
        google.com/tpu: {tpu_chips_per_node}
    container_security_context_yaml: |
      privileged: true
    cores_per_chip: 1
    node_selector_yaml: |
      node.kubernetes.io/instance-type: ct6e-standard-4t
      cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
      cloud.google.com/gke-tpu-topology: {tpu_topology}
    tolerations_yaml: |
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
slurm:
  variables:
    tpu_run_wrapper: srun {srun_args}
