schedulers:
- kubernetes
- slurm
variables:
  cpu_affinity: 0-71:0-71:72-143:72-143
  gpus_per_node: 4
  mem_affinity: 0:0:1:1
  n_ranks: '{processes_per_node}*{n_nodes}'
  processes_per_node: '{gpus_per_node}'
kubernetes:
  variables:
    container_resources_yaml: |
      limits:
        nvidia.com/gpu: {gpus_per_node}
      requests:
        nvidia.com/gpu: {gpus_per_node}
      claims:
      - name: compute-domain-channel
    container_security_context_yaml: |
      privileged: true
      runAsUser: 0
    custom_resources_yaml: |
      apiVersion: resource.nvidia.com/v1beta1
      kind: ComputeDomain
      metadata:
        name: {job_name}-cd
        namespace: "{kubernetes_namespace}"
        labels:
          chs-run: {job_name}
      spec:
        numNodes: {n_nodes}
        channel:
          resourceClaimTemplate:
            name: {job_name}-cdc
      ---
    extra_volume_mounts_yaml: |
      - name: shared-memory
        mountPath: /dev/shm
    extra_volumes_yaml: |
      - name: shared-memory
        emptyDir:
          medium: "Memory"
    node_selector_yaml: 'node.kubernetes.io/instance-type: a4x-maxgpu-4g-metal'
    pod_annotations_yaml: |
      compute-domain.nvidia.com/channel-claim-template: {job_name}-cdc
      compute-domain.nvidia.com/domain-name: {job_name}-cd
      networking.gke.io/default-interface: {default_interface_name}
      networking.gke.io/interfaces: |
        {all_interfaces_json}
    pod_resource_claims_yaml: |
      - name: compute-domain-channel
        resourceClaimTemplateName: {job_name}-cdc
    tolerations_yaml: |
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
