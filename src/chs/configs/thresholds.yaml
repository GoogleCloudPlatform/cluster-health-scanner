# TODO: Calibrate and refine baseline numbers for production environments
default:
  nccl-cluster:
    type: min
    thresholds:
      bandwidth: 50
  nccl-single-node:
    type: min
    thresholds:
      bandwidth: 50
  nccl-pairwise:
    type: min
    thresholds:
      bandwidth: 50
  stream:
    type: relative
    thresholds:
      efficiency: 0.85
  dcgm:
    type: scalar
    thresholds:
      Result:
        - value: "Pass"
          conditions:
            context: "memory"
        - value: "Pass"
          conditions:
            context: "pcie"
        - value: "Pass"
          conditions:
            context: "software"
        - value: "Pass"
          conditions:
            context: "diagnostic"
        - value: "Pass"
          conditions:
            context: "nvbandwidth"
        - value: "Pass"
          conditions:
            context: "pulse_test"
        - value: "Pass"
          conditions:
            context: "memtest"
        - value: "Pass"
          conditions:
            context: "memory_bandwidth"
        - value: "Pass"
          conditions:
            context: "targeted_stress"
        - value: "Pass"
          conditions:
            context: "targeted_power"


