default:
  nccl-cluster:
    type: min
    thresholds:
      bandwidth: 50
  nccl-single-node:
    type: min
    thresholds:
      bandwidth: 50
  nccl-pairwise:
    type: min
    thresholds:
      bandwidth: 50


