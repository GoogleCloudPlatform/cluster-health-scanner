  nvidia-dcgm:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "dcgm-fom"}]
    variables:
      diag_level: [1,2]
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/cloud-native/dcgm:4.5.1-1-ubi9
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

  nvidia-smi:
    modifiers: [{name: "gpu-persistence-mode"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvidia/cuda:12.4.1-runtime-ubuntu22.04
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""


