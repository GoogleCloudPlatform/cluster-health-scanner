a3-mega:
  variables:
    pod_annotations_yaml: |
      networking.gke.io/default-interface: {default_interface_name}
      networking.gke.io/interfaces: |
        {all_interfaces_json}
    node_selector_yaml: "node.kubernetes.io/instance-type: a3-megagpu-8g"
    tolerations_yaml: |
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    extra_volumes_yaml: |
      - name: shared-memory
        emptyDir:
          medium: "Memory"
      - name: nvidia
        hostPath:
          path: /home/kubernetes/bin/nvidia/lib64
      - name: sys
        hostPath:
          path: /sys
      - name: proc-sys
        hostPath:
          path: /proc/sys
      - name: aperture-devices
        hostPath:
          path: /dev/aperture_devices
    extra_volume_mounts_yaml: |
      - name: shared-memory
        mountPath: /dev/shm
      - name: nvidia
        mountPath: /usr/local/nvidia/lib64
      - name: aperture-devices
        mountPath: /dev/aperture_devices
    container_resources_yaml: |
      limits:
        nvidia.com/gpu: {gpus_per_node}
    container_security_context_yaml: |
      privileged: true
  nccl-tests:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "nccl-error-detector"}, {name: "generic-error-detector"}]
    env_vars:
      set:
        OMPI_ALLOW_RUN_AS_ROOT: 1
        NCCL_FASTRAK_LLCM_DEVICE_DIRECTORY: "/dev/aperture_devices"
        NCCL_LIB_DIR: "/usr/local/nvidia/lib64"
        NCCL_DEBUG: INFO
    variables:
      jobset_template: jobset_mpi.yaml.tpl
      init_containers_yaml: |
        - name: tcpxo-daemon
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/tcpgpudmarxd-dev:v1.0.21
          imagePullPolicy: Always
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              chmod 755 /fts/entrypoint_rxdm_container.sh
              /fts/entrypoint_rxdm_container.sh --num_hops=2 --num_nics=8
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_BIND_SERVICE
          volumeMounts:
            - name: nvidia
              mountPath: /usr/local/nvidia/lib64
            - name: sys
              mountPath: /hostsysfs
            - name: proc-sys
              mountPath: /hostprocsysfs
            - name: aperture-devices
              mountPath: /dev/aperture_devices
      container_image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/nccl-plugin-gpudirecttcpx-dev:v1.0.15
      ssh_port: 222
      nccl-tests_path: /scripts
      processes_per_node: {gpus_per_node}
      mpi_env_vars: $(echo ${!NCCL*} ${!OMPI*} LD_LIBRARY_PATH | sed 's/ / -x /g')
      mpi_command: |
        WORKLOAD_NAME=$(basename $(dirname $(pwd)))
        BINARY=$(echo $WORKLOAD_NAME | tr '-' '_')_perf
        mpirun --mca btl tcp,self --mca btl_tcp_if_include eth0 \
          --mca orte_keep_fqdn_hostnames 1 --mca plm_rsh_args "-p {ssh_port}" \
          -np $(( {n_nodes} * {processes_per_node} )) \
          --hostfile /tmp/hostfile \
          -x {mpi_env_vars} \
          taskset -c 32-63 /scripts/demo_mpi_entry_with_config_profile.sh $BINARY -b 8 -e 8G -f 2 -g 1 -w 5 --iters 20

  nvidia-dcgm:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "dcgm-fom"}, {name: "dcgm-error-detector"}, {name: "generic-error-detector"}]
    variables:
      diag_level: [1,2]
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/cloud-native/dcgm:4.5.1-1-ubi9
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

  nvidia-smi:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "generic-error-detector"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvidia/cuda:11.0.3-runtime-ubuntu20.04
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

  nvidia-stream:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "generic-error-detector"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/hpc-benchmarks:25.09
      n_ranks: "{gpus_per_node}"
      processes_per_node: "{gpus_per_node}"
      n_nodes: 1
      mpi_command: "mpirun --allow-run-as-root -n {n_ranks} --tag-output bash -c 'export CUDA_VISIBLE_DEVICES=$OMPI_COMM_WORLD_LOCAL_RANK; exec \"$@\"' --"
      app_workdir: /workspace
      n_elements: "300653184"
      cpu_affinity: "0-51:0-51:0-51:0-51:52-103:52-103:52-103:52-103"
      mem_affinity: "0:0:0:0:1:1:1:1"

  nvidia-gemm:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "generic-error-detector"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/hpc-benchmarks:25.09
      processes_per_node: 8
      n_ranks: 8
      n_nodes: 1
      mpi_command: "mpirun --allow-run-as-root -n {n_ranks} -x CUDA_VISIBLE_DEVICES"
      app_workdir: /workspace/microbenchmarks
      gpu_affinity: "0:1:2:3:4:5:6:7"
      cpu_affinity: "0-51:0-51:0-51:0-51:52-103:52-103:52-103:52-103"
      mem_affinity: "0:0:0:0:1:1:1:1"
      type: "fp64"
      iter: 32
      m: 16384
      n: 16384
      k: 16384
a4x:
  variables:
    pod_annotations_yaml: |
      compute-domain.nvidia.com/channel-claim-template: {job_name}-compute-domain-channel
      compute-domain.nvidia.com/domain-name: {job_name}-compute-domain
      networking.gke.io/default-interface: {default_interface_name}
      networking.gke.io/interfaces: |
        {all_interfaces_json}
    jobset_labels_yaml: |
      chs-run: {job_name}
    node_selector_yaml: "node.kubernetes.io/instance-type: a4x-highgpu-4g"
    tolerations_yaml: |
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    extra_volumes_yaml: |
      - name: shared-memory
        emptyDir:
          medium: "Memory"
    extra_volume_mounts_yaml: |
      - name: shared-memory
        mountPath: /dev/shm
    container_resources_yaml: |
      limits:
        nvidia.com/gpu: {gpus_per_node}
    container_security_context_yaml: |
      privileged: true
      runAsUser: 0
    claims:
      - name: compute-domain-channel
    pod_resource_claims_yaml: |
      - name: compute-domain-channel
        resourceClaimTemplateName: {job_name}-compute-domain-channel
    custom_resources_yaml: |
      apiVersion: resource.nvidia.com/v1beta1
      kind: ComputeDomain
      metadata:
        name: {job_name}-compute-domain
        labels:
          chs-run: {job_name}
      spec:
        numNodes: {n_nodes}
