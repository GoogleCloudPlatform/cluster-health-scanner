a3-ultra:
  variables:
    gpu_subnet_prefix: rdma
    pod_annotations_yaml: |
      networking.gke.io/default-interface: 'eth0'
      networking.gke.io/interfaces: |
        [
          \{"interfaceName":"eth0","network":"default"\},
          \{"interfaceName":"eth2","network":"{gpu_subnet_prefix}-0"\},
          \{"interfaceName":"eth3","network":"{gpu_subnet_prefix}-1"\},
          \{"interfaceName":"eth4","network":"{gpu_subnet_prefix}-2"\},
          \{"interfaceName":"eth5","network":"{gpu_subnet_prefix}-3"\},
          \{"interfaceName":"eth6","network":"{gpu_subnet_prefix}-4"\},
          \{"interfaceName":"eth7","network":"{gpu_subnet_prefix}-5"\},
          \{"interfaceName":"eth8","network":"{gpu_subnet_prefix}-6"\},
          \{"interfaceName":"eth9","network":"{gpu_subnet_prefix}-7"\}
        ]
    node_selector_yaml: "cloud.google.com/gke-nodepool: a3-ultragpu-8g-a3-ultragpu-pool"
    tolerations_yaml: |
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    extra_volumes_yaml: |
      - name: shared-memory
        emptyDir:
          medium: "Memory"
    extra_volume_mounts_yaml: |
      - name: shared-memory
        mountPath: /dev/shm
    container_resources_yaml: |
      limits:
        nvidia.com/gpu: 8
    container_security_context_yaml: |
      privileged: true
  nccl-tests:
    modifiers: [{name: "gpu-persistence-mode"},{name: "nccl-gib"}]
    env_vars:
      set:
        OMPI_ALLOW_RUN_AS_ROOT: 1
        CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
        NCCL_NET: gIB
    variables:
      jobset_template: jobset_mpi.yaml.tpl
      container_image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic:v1.1.0
      ssh_port: 2222
      nccl-tests_path: /third_party/nccl-tests
      mpi_env_vars: $(echo ${!NCCL*} ${!OMPI*} LD_LIBRARY_PATH | sed 's/ / -x /g')
      mpi_command: |
        mpirun -n {n_ranks} -N {processes_per_node} \
          --hostfile /tmp/hostfile --bind-to none \
          --mca btl self,tcp --mca btl_tcp_if_include eth0 \
          --mca orte_keep_fqdn_hostnames 1 --mca plm_rsh_no_tree_spawn 1 \
          --mca plm_rsh_agent "ssh -q -p {ssh_port} -o StrictHostKeyChecking=no -o BatchMode=yes" \
          -x CUDA_VISIBLE_DEVICES \
          -x PATH="{nccl-tests_path}/build:$PATH" \
          -x {mpi_env_vars}

    success_criteria:
      avg_bus_bw:
        mode: fom_comparison
        fom_name: "Avg. Bus Bandwidth"
        formula: "{value} > 80"
  nvidia-dcgm:
    modifiers: [{name: "gpu-persistence-mode"}]
    variables:
      diag_level: [1,2]
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/cloud-native/dcgm:4.5.1-1-ubi9
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

  nvidia-smi:
    modifiers: [{name: "gpu-persistence-mode"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvidia/cuda:11.0.3-runtime-ubuntu20.04
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

