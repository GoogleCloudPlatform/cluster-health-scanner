a3-ultra:
  variables:
    pod_annotations_yaml: |
      networking.gke.io/default-interface: {default_interface_name}
      networking.gke.io/interfaces: |
        {all_interfaces_json}
    node_selector_yaml: "node.kubernetes.io/instance-type: a3-ultragpu-8g"
    tolerations_yaml: |
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    extra_volumes_yaml: |
      - name: shared-memory
        emptyDir:
          medium: "Memory"
    extra_volume_mounts_yaml: |
      - name: shared-memory
        mountPath: /dev/shm
    container_resources_yaml: |
      limits:
        nvidia.com/gpu: 8
    container_security_context_yaml: |
      privileged: true
  nccl-tests:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "nccl-gib"}, {name: "nccl-error-detector"}, {name: "generic-error-detector"}]
    env_vars:
      set:
        OMPI_ALLOW_RUN_AS_ROOT: 1
        CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
        NCCL_NET: gIB
        NCCL_DEBUG: INFO
    variables:
      jobset_template: jobset_mpi.yaml.tpl
      container_image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic:v1.1.0
      ssh_port: 2222
      nccl-tests_path: /third_party/nccl-tests
      mpi_env_vars: $(echo ${!NCCL*} ${!OMPI*} LD_LIBRARY_PATH | sed 's/ / -x /g')
      mpi_command: |
        mpirun -n {n_ranks} -N {processes_per_node} \
          --hostfile /tmp/hostfile --bind-to none \
          --mca btl self,tcp --mca btl_tcp_if_include eth0 \
          --mca orte_keep_fqdn_hostnames 1 --mca plm_rsh_no_tree_spawn 1 \
          --mca plm_rsh_agent "ssh -q -p {ssh_port} -o StrictHostKeyChecking=no -o BatchMode=yes" \
          -x CUDA_VISIBLE_DEVICES \
          -x PATH="{nccl-tests_path}/build:$PATH" \
          -x {mpi_env_vars}

  nvidia-dcgm:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "dcgm-fom"}, {name: "dcgm-error-detector"}, {name: "generic-error-detector"}]
    variables:
      diag_level: [1,2]
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/cloud-native/dcgm:4.5.1-1-ubi9
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

  nvidia-smi:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "generic-error-detector"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvidia/cuda:11.0.3-runtime-ubuntu20.04
      processes_per_node: 1
      n_ranks: 1
      n_nodes: 1
      mpi_command: ""

  nvidia-stream:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "generic-error-detector"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/hpc-benchmarks:25.09
      n_ranks: "{gpus_per_node}"
      processes_per_node: "{gpus_per_node}"
      n_nodes: 1
      mpi_command: "mpirun --allow-run-as-root -n {n_ranks} --tag-output bash -c 'export CUDA_VISIBLE_DEVICES=$OMPI_COMM_WORLD_LOCAL_RANK; exec \"$@\"' --"
      app_workdir: /workspace
      n_elements: "1500000000"
      cpu_affinity: "0-55:0-55:0-55:0-55:56-111:56-111:56-111:56-111"
      mem_affinity: "0:0:0:0:1:1:1:1"

  nvidia-gemm:
    modifiers: [{name: "gpu-persistence-mode"}, {name: "generic-error-detector"}]
    variables:
      jobset_template: jobset_standard.yaml.tpl
      container_image: nvcr.io/nvidia/hpc-benchmarks:25.09
      processes_per_node: 8
      n_ranks: 8
      n_nodes: 1
      mpi_command: "mpirun --allow-run-as-root -n {n_ranks} -x CUDA_VISIBLE_DEVICES"
      app_workdir: /workspace/microbenchmarks
      gpu_affinity: "0:1:2:3:4:5:6:7"
      cpu_affinity: "0-55:0-55:0-55:0-55:56-111:56-111:56-111:56-111"
      mem_affinity: "0:0:0:0:1:1:1:1"
      type: "fp64"
      iter: 32
      m: 16384
      n: 16384
      k: 16384
