    variables:
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
      benchmarks_yaml_file: "tpuv6e/host_device.yaml"
      container_name: "accelerator-microbenchmarks:1.0.0"
      container_uri: "docker://us-docker.pkg.dev#gce-ai-infra/chs/accelerator-microbenchmarks:1.0.0"
      srun_args: "--cpu-bind=none --container-workdir /app/accelerator-microbenchmarks --container-image {container_path} --container-writable --container-mounts /dev/vfio:/dev/vfio,{experiment_run_dir}:{experiment_run_dir} --wait=60"
