a3-ultra:
  nccl-tests:
    modifiers: [{name: "nccl-gib"}, {name: "nccl-linker"}, {name: "nccl-test-compiler"}, {name: "pyxis-enroot"}]
    env_vars:
      set:
        NCCL_NET: gIB
        NCCL_SOCKET_IFNAME: enp0s19,enp192s20
        LD_LIBRARY_PATH: "/usr/local/gib/lib64:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
    variables:
      container_name: pytorch:24.09-py3
      container_uri: "docker://nvcr.io#nvidia/pytorch:24.09-py3"
      srun_args: "--mpi=pmi2 --export=ALL --container-workdir {nccl_tests_build_dir}/build/ --container-image {container_path} --container-mounts \"/var/tmp:/var/tmp,{nccl_tests_build_dir}:{nccl_tests_build_dir},/usr/local/gib\" --container-writable --wait=60"
      nccl-tests_path: "{nccl_tests_build_dir}/build/"
      begin_message_size: "256M"
      end_message_size: "8G"
    success_criteria:
      avg_bus_bw:
        mode: fom_comparison
        fom_name: "Avg. Bus Bandwidth"
        formula: "{value} > 80"
      out_of_bounds_values:
        mode: fom_comparison
        fom_name: "Out of bounds values"
        formula: "{value} == 0"
  nvidia-dcgm:
    variables:
      diag_level: [1,2]
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
  nvidia-stream:
    modifiers: [{name: "pyxis-enroot"}]
    variables:
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
      container_name: hpc-benchmarks:25.09
      container_uri: "docker://nvcr.io#nvidia/hpc-benchmarks:25.09"
      srun_args: "--container-workdir /workspace --container-image {container_path} --container-writable --wait=60"
      n_elements: "1500000000"
      gpu_affinity: "0:1:2:3:4:5:6:7"
      cpu_affinity: "0-55:0-55:0-55:0-55:56-111:56-111:56-111:56-111"
      mem_affinity: "0:0:0:0:1:1:1:1"
  nvidia-gemm:
    modifiers: [{name: "pyxis-enroot"}]
    variables:
      n_ranks: 8
      processes_per_node: 8
      n_nodes: 1
      container_name: "hpc-benchmarks:25.09"
      container_uri: "docker://nvcr.io#nvidia/hpc-benchmarks:25.09"
      srun_args: "--cpu-bind=none --mpi=pmix --container-workdir /workspace/microbenchmarks --container-image {container_path} --container-writable --container-mounts {experiment_run_dir}:{experiment_run_dir} --wait=60"
      gpu_affinity: "0:1:2:3:4:5:6:7"
      cpu_affinity: "0-55:0-55:0-55:0-55:56-111:56-111:56-111:56-111"
      mem_affinity: "0:0:0:0:1:1:1:1"
      type: "fp64"
      iter: 32
      m: 16384
      n: 16384
      k: 16384
  nvidia-smi:
    variables:
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
a3-high:
  nccl-tests:
    modifiers: [{name: "nccl-linker"}, {name: "pyxis-enroot"}]
    env_vars:
      set:
        OMPI_MCA_btl: tcp,self
        USE_TCPX: "yes"
        UDS_PATH: "/run/tcpx-${SLURM_JOB_ID}"
        NCCL_NET: "GPUDirectTCPX_v7"
        NCCL_SOCKET_IFNAME: "enp0s12"
        NCCL_GPUDIRECTTCPX_CTRL_DEV: "enp0s12"
        NCCL_GPUDIRECTTCPX_SOCKET_IFNAME: "enp6s0,enp12s0,enp134s0,enp140s0"
        NCCL_CROSS_NIC: "0"
        NCCL_ALGO: "Ring"
        NCCL_PROTO: "Simple"
        NCCL_NSOCKS_PERTHREAD: "4"
        NCCL_SOCKET_NTHREADS: "1"
        NCCL_DYNAMIC_CHUNK_SIZE: "524288"
        NCCL_P2P_NET_CHUNKSIZE: "524288"
        NCCL_P2P_PCI_CHUNKSIZE: "524288"
        NCCL_P2P_NVL_CHUNKSIZE: "1048576"
        NCCL_BUFFSIZE: "4194304"
        CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
        NCCL_NET_GDR_LEVEL: "PIX"
        NCCL_P2P_PXN_LEVEL: "0"
        NCCL_GPUDIRECTTCPX_UNIX_CLIENT_PREFIX: "/run/tcpx-${SLURM_JOB_ID}"
        NCCL_GPUDIRECTTCPX_PROGRAM_FLOW_STEERING_WAIT_MICROS: "500000"
        NCCL_GPUDIRECTTCPX_TX_BINDINGS: "enp6s0:8-21,112-125;enp12s0:8-21,112-125;enp134s0:60-73,164-177;enp140s0:60-73,164-177"
        NCCL_GPUDIRECTTCPX_RX_BINDINGS: "enp6s0:22-35,126-139;enp12s0:22-35,126-139;enp134s0:74-87,178-191;enp140s0:74-87,178-191"
    variables:
      processes_per_node: {gpus_per_node}
      container_name: nccl-plugin-gpudirecttcpx-dev:v3.1.9
      container_uri: "docker://us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpx/nccl-plugin-gpudirecttcpx-dev:v3.1.9-2.19.4-12.0"
      nccl-tests_path: "/third_party/nccl-tests/build/"
      srun_args: "--mpi=pmix --cpu-bind=none --container-workdir /third_party/nccl-tests/build/ --export=ALL --container-image {container_path} --container-mounts \"/var/tmp,/var/lib/tcpx/lib64,/run/tcpx-${SLURM_JOB_ID}\" --container-writable --wait=60"
    success_criteria:
      avg_bus_bw:
        mode: fom_comparison
        fom_name: "Avg. Bus Bandwidth"
        formula: "{value} > 30"
      out_of_bounds_values:
        mode: fom_comparison
        fom_name: "Out of bounds values"
        formula: "{value} == 0"
  nvidia-dcgm:
    variables:
      diag_level: [1,2]
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
