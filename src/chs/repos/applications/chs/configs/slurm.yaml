ct6e-standard-4t:
  variables:
    tpu_run_wrapper: "srun {srun_args}"
  tpu-info:
    modifiers: [{name: "generic-error-detector"}, {name: "tpu-error-detector"}]
    env_vars:
      set:
        PYTHONPATH: "/usr/local/lib/python3.10/dist-packages"
    variables:
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
      srun_args: "--cpu-bind=none --wait=60"
  tpu-gemm:
    modifiers: [{name: "pyxis-enroot"}, {name: "generic-error-detector"}, {name: "tpu-error-detector"}]
    env_vars:
      set:
        XDG_RUNTIME_DIR: "$HOME/.enroot"
        ENROOT_RUNTIME_PATH: "$HOME/.enroot/run"
    variables:
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
      benchmarks_yaml_file: "tpuv6e/gemm_16384_bf16.yaml"
      container_name: "accelerator-microbenchmarks:1.0.0"
      container_uri: "docker://us-docker.pkg.dev#gce-ai-infra/chs/accelerator-microbenchmarks:1.0.0"
      srun_args: "--cpu-bind=none --container-workdir /app/accelerator-microbenchmarks --container-image {container_path} --container-writable --container-mounts /dev/vfio:/dev/vfio,{experiment_run_dir}:{experiment_run_dir} --wait=60"
  tpu-hbm:
    modifiers: [{name: "pyxis-enroot"}, {name: "generic-error-detector"}, {name: "tpu-error-detector"}]
    env_vars:
      set:
        XDG_RUNTIME_DIR: "$HOME/.enroot"
        ENROOT_RUNTIME_PATH: "$HOME/.enroot/run"
    variables:
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
      benchmarks_yaml_file: "tpuv6e/hbm_copy_bf16.yaml"
      container_name: "accelerator-microbenchmarks:1.0.0"
