      gpu_affinity: "0:1:2:3"
      cpu_affinity: "0-69:0-69:70-139:70-139"
      mem_affinity: "0:0:1:1"
      type: "fp64"
      iter: 32
      m: 51200
      n: 51200
      k: 51200
  nvidia-smi:
    variables:
      n_ranks: 1
