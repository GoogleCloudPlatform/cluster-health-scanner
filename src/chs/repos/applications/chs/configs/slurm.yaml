a3-mega:
  nvidia-dcgm:
    modifiers: [{name: "dcgm-fom"}, {name: "dcgm-error-detector"}, {name: "generic-error-detector"}]
    variables:
      diag_level: [1,2]
      n_ranks: 1
      processes_per_node: 1
      n_nodes: 1
  nvidia-stream:
    modifiers: [{name: "pyxis-enroot"}, {name: "generic-error-detector"}]
    variables:
      n_ranks: "{gpus_per_node}"
      processes_per_node: "{gpus_per_node}"
      n_nodes: 1
      container_name: hpc-benchmarks:25.09
      container_uri: "docker://nvcr.io#nvidia/hpc-benchmarks:25.09"
      srun_args: "-l --container-workdir /workspace --container-image {container_path} --container-writable --wait=60"
      n_elements: "300653184"
      cpu_affinity: "0-51:0-51:0-51:0-51:52-103:52-103:52-103:52-103"
      mem_affinity: "0:0:0:0:1:1:1:1"
  nvidia-gemm:
    modifiers: [{name: "pyxis-enroot"}, {name: "generic-error-detector"}]
    variables:
      n_ranks: "{gpus_per_node}"
      processes_per_node: "{gpus_per_node}"
      n_nodes: 1
      container_name: "hpc-benchmarks:25.09"
      container_uri: "docker://nvcr.io#nvidia/hpc-benchmarks:25.09"
      srun_args: "--cpu-bind=none --mpi=pmix --container-workdir /workspace/microbenchmarks --container-image {container_path} --container-writable --container-mounts {experiment_run_dir}:{experiment_run_dir} --wait=60"
      gpu_affinity: "0:1:2:3:4:5:6:7"
      cpu_affinity: "0-51:0-51:0-51:0-51:52-103:52-103:52-103:52-103"
      mem_affinity: "0:0:0:0:1:1:1:1"
      type: "fp64"
      iter: 32
      m: 16384
      n: 16384
      k: 16384
  nccl-tests:
    modifiers: [{name: "nccl-tcpxo"}, {name: "nccl-linker"}, {name: "nccl-test-compiler"}, {name: "pyxis-enroot"}, {name: "generic-error-detector"}]
    env_vars:
      set:
        NCCL_FASTRAK_CTRL_DEV: enp0s12
        NCCL_FASTRAK_IFNAME: enp6s0,enp7s0,enp13s0,enp14s0,enp134s0,enp135s0,enp141s0,enp142s0
        NCCL_SOCKET_IFNAME: enp0s12
        NCCL_FASTRAK_LLCM_DEVICE_DIRECTORY: /dev/aperture_devices
    variables:
      container_name: pytorch:24.09-py3
      container_uri: "docker://nvcr.io#nvidia/pytorch:24.09-py3"
      nccl_tests_build_dir: "{workspace_shared}/nccl-tests-{nccl_tests_ref}"
      srun_args: "--mpi=pmi2 --export=ALL --container-workdir {nccl_tests_build_dir}/build/ --container-image {container_path} --container-mounts \"/var/tmp:/var/tmp,{nccl_tests_build_dir}:{nccl_tests_build_dir},/var/lib/tcpxo/lib64/\" --container-writable --wait=60"
      nccl-tests_path: "{nccl_tests_build_dir}/build/"
      begin_message_size: "256M"
      end_message_size: "8G"
    success_criteria:
      avg_bus_bw:
        mode: fom_comparison
        fom_name: "Avg. Bus Bandwidth"
        formula: "{value} > 80"
      out_of_bounds_values:
        mode: fom_comparison
        fom_name: "Out of bounds values"
        formula: "{value} == 0"
