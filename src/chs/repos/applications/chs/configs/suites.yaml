suites:
- name: lite
  tests:
  - name: dcgm
    variables:
      diag_level: [1, 2]
  - name: nccl-cluster
    workloads: [all-gather, all-reduce]
    variables:
      begin_message_size: 2G
      end_message_size: 4G
- name: standard
  tests:
  - name: dcgm
    variables:
      diag_level: [3]
  - name: nccl-cluster
    workloads: [all-gather, all-reduce]
    variables:
      begin_message_size: 2G
      end_message_size: 8G
  - name: nccl-pairwise
    workloads: [all-gather, all-reduce]
    variables:
      begin_message_size: 2G
      end_message_size: 8G
- name: extensive
  tests:
  - name: dcgm
    variables:
      diag_level: [4]
  - name: nccl-cluster
    workloads: [all-gather, all-reduce]
    variables:
      begin_message_size: 2G
      end_message_size: 16G
  - name: nccl-pairwise
    workloads: [all-gather, all-reduce]
    variables:
      begin_message_size: 2G
      end_message_size: 16G
