platforms:
- a3-ultragpu-8g
- a4-highgpu-8g
- a3-megagpu-8g
- a4x-highgpu-4g
- a4x-maxgpu-4g-metal
- a5x-highgpu-4g-metal
defaults:
  modifiers:
  - name: generic-error-detector
  variables:
    n_elements: '1500000000'
  kubernetes:
    modifiers:
    - name: gpu-persistence-mode
    variables:
      app_workdir: /workspace
      container_image: nvcr.io/nvidia/hpc-benchmarks:25.09
      job_template: job_standard.yaml.tpl
      mpi_command: mpirun --allow-run-as-root -n {n_ranks} --tag-output bash -c 'export CUDA_VISIBLE_DEVICES=$OMPI_COMM_WORLD_LOCAL_RANK; exec "$@"' --
  slurm:
    modifiers:
    - name: pyxis-enroot
    variables:
      container_name: hpc-benchmarks:25.09
      container_uri: docker://nvcr.io#nvidia/hpc-benchmarks:25.09
      srun_args: -l --container-workdir /workspace --container-image {container_path} --container-writable --wait=60
machines:
  a4-highgpu-8g:
    slurm:
      variables:
        n_elements: '2040000000'
  a3-megagpu-8g:
    variables:
      n_elements: '300653184'
  a4x-highgpu-4g:
    variables:
      n_elements: '2800000000'
  a4x-maxgpu-4g-metal:
    variables:
      n_elements: '2800000000'
    kubernetes:
      variables:
        container_image: nvcr.io/nvidia/hpc-benchmarks:26.02
    slurm:
      variables:
        container_name: hpc-benchmarks:26.02
        container_uri: docker://nvcr.io#nvidia/hpc-benchmarks:26.02
  a5x-highgpu-4g-metal:
    variables:
      n_elements: '2800000000'
    kubernetes:
      variables:
        container_image: nvcr.io/nvidia/hpc-benchmarks:26.02
