platforms:
- tpu7x-standard-4t
- ct6e-standard-4t
defaults:
  modifiers:
  - name: generic-error-detector
  - name: tpu-error-detector
  variables:
    benchmarks_yaml_file: tpuv6e/hbm_copy_bf16.yaml
  kubernetes:
    variables:
      container_image: us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:1.1.1
      job_template: job_standard.yaml.tpl
      mpi_command: ''
  slurm:
    env_vars:
      set:
        ENROOT_RUNTIME_PATH: $HOME/.enroot/run
        XDG_RUNTIME_DIR: $HOME/.enroot
    modifiers:
    - name: pyxis-enroot
    variables:
      container_name: accelerator-microbenchmarks:1.1.1
      container_uri: docker://us-docker.pkg.dev#gce-ai-infra/chs/accelerator-microbenchmarks:1.1.1
      srun_args: --cpu-bind=none --container-workdir /app/accelerator-microbenchmarks --container-image {container_path} --container-writable --container-mounts /dev/vfio:/dev/vfio,{experiment_run_dir}:{experiment_run_dir} --wait=60
  standalone:
    variables:
      runtime: tpu
machines:
  tpu7x-standard-4t:
    variables:
      benchmarks_yaml_file: tpu7x/hbm_copy_bf16.yaml
