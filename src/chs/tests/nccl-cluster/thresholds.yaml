type: min
default:
  bandwidth: 50
a3-ultragpu-8g:
  bandwidth:
    - value: 332.0
      conditions:
        workload_name: all-reduce
    - value: 318.0
      conditions:
        workload_name: all-gather
a3-megagpu-8g:
  bandwidth:
    - value: 167.0
      conditions:
        workload_name: all-reduce
    - value: 178.0
      conditions:
        workload_name: all-gather
a4-highgpu-8g:
  bandwidth:
    - value: 357.0
      conditions:
        workload_name: all-reduce
    - value: 357.0
      conditions:
        workload_name: all-gather
a4x-highgpu-4g:
  # Intradomain only. Interdomain nccl-cluster runs have no threshold and
  # report UNKNOWN.
  bandwidth:
    - value: 800.0
      conditions:
        domain_type: intradomain
        workload_name: all-reduce
    - value: 600.0
      conditions:
        domain_type: intradomain
        workload_name: all-gather
a4x-maxgpu-4g-metal:
  # Intradomain only. Interdomain nccl-cluster runs have no threshold and
  # report UNKNOWN.
  # TODO: Recalibrate for single-domain runs (~890 GB/s all-reduce seen).
  bandwidth:
    - value: 330.0
      conditions:
        domain_type: intradomain
        workload_name: all-reduce
    - value: 340.0
      conditions:
        domain_type: intradomain
        workload_name: all-gather
a5x-highgpu-4g-metal:
  bandwidth:
    - value: 880.0
      conditions:
        workload_name: all-reduce
    - value: 800.0
      conditions:
        workload_name: all-gather
