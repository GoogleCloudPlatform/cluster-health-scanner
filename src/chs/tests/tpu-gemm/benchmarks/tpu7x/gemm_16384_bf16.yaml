benchmark:
  name: gemm
  xprof_timing: true
  xprof_device_timing_aggregation: local_slowest_device
  standalone_host_init: true
  params:
    warmup_tries: 2
    num_runs: 100
    in_dtype: bfloat16
    out_dtype: bfloat16
    m: 16384
    k: 16384
    n: 16384
