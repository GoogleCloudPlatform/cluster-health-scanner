platforms:
- tpu7x-standard-4t
- ct6e-standard-4t
defaults:
  modifiers:
  - name: generic-error-detector
  - name: tpu-error-detector
  variables:
    benchmarks_yaml_file: tpuv6e/gemm_32768x4096x4096_bf16.yaml
  kubernetes:
    variables:
      container_image: '{chs_image}'
      job_template: job_standard.yaml.tpl
      mpi_command: ''
  standalone:
    variables:
      runtime: tpu
machines:
  tpu7x-standard-4t:
    variables:
      benchmarks_yaml_file: tpu7x/gemm_16384_bf16.yaml
