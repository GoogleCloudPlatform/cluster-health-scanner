platforms:
- tpu7x-standard-4t
- ct6e-standard-4t
defaults:
  modifiers:
  - name: generic-error-detector
  - name: tpu-error-detector
  kubernetes:
    variables:
      container_image: us-docker.pkg.dev/gce-ai-infra/chs/accelerator-microbenchmarks:1.0-latest
      jobset_template: jobset_standard.yaml.tpl
      mpi_command: ''
  slurm:
    env_vars:
      set:
        PYTHONPATH: /usr/local/lib/python3.10/dist-packages
    variables:
      srun_args: --cpu-bind=none --wait=60
