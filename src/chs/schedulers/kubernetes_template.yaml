ramble:
  variants:
    workflow_manager: kubernetes-jobset
  config:
    overwrite_inventories: True
  variables:
    chs_run_id: ""
    scheduler: kubernetes
    nodes: []
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: ""
    tests: []
    default_interface_name: ""
    all_interfaces_json: ""
    timeout: 0
    deadline: 0
    jobset_labels_yaml: ""
    suspend_jobset: false

  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            chs:
              variables:
                placeholder: "true"
