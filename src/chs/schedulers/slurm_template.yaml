ramble:
  variants:
    workflow_manager: slurm
  config:
    overwrite_inventories: True
  variables:
    nodes: {nodes}
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: {machine_type}
    tests: {tests}
    scheduler: slurm
    container_dir: {images_dir}
    tcp_interfaces: "{tcp_interfaces}"
    timeout: {timeout}
    deadline: {deadline}

  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            chs:
              variables:
                placeholder: "true"
