ramble:
  variants:
    workflow_manager: gke_jobset
  config:
    overwrite_inventories: True
  variables:
    scheduler: gke
    nodes: {nodes}
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: {machine_type}
    tests: {tests}
    gpu_subnet_prefix: 'rdma'

  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            cluster_health_diagnostics:
              variables:
                placeholder: "true"
