ramble:
  variants:
    workflow_manager: gke_jobset
  config:
    overwrite_inventories: True
  variables:
    scheduler: gke
    nodes: {nodes}
    n_nodes: 1
    processes_per_node: 1
    n_ranks: 1
    machine_type: {machine_type}
    tests: {tests}
    default_interface_name: {default_interface_name}
    all_interfaces_json: |
      {all_interfaces_json}
    timeout: {timeout}
    deadline: {deadline}

  applications:
    chs:
      workloads:
        cluster_health:
          experiments:
            cluster_health_diagnostics:
              variables:
                placeholder: "true"
