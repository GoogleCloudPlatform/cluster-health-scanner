tests:
  - name: nvidia-smi
    category: GPU Diagnostics
    description: Basic GPU health and driver check
    long_description: Queries GPU status to measure power draw, clock frequencies, and performance states, while verifying driver health and GPU count.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: slurm
        machine_type: a4x-maxgpu-4g-metal
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: dcgm
    category: GPU Diagnostics
    description: Deep hardware diagnostics
    long_description: Runs DCGM diagnostic suites to stress-test PCIe, memory, and compute engines, measuring hardware stability and identifying faults, thermal issues, or power throttling.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: slurm
        machine_type: a4x-maxgpu-4g-metal
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: gemm
    category: Compute
    description: General Matrix Multiply benchmark
    long_description: Runs General Matrix Multiply (GEMM) benchmarks to measure peak floating-point compute throughput (TFLOPS) and verify computation correctness.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: slurm
        machine_type: a4x-maxgpu-4g-metal
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: nccl-single-node
    category: Network & Collectives
    description: Single node network testing
    long_description: Runs NCCL benchmarks within a single node to measure intra-node GPU-to-GPU bandwidth (GB/s) and latency.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: slurm
        machine_type: a4x-maxgpu-4g-metal
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: nccl-cluster
    category: Network & Collectives
    description: Full cluster ring bandwidth
    long_description: Runs NCCL benchmarks across multiple nodes to measure inter-node bandwidth (GB/s) and latency under collective workloads.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: nccl-domain
    category: Network & Collectives
    description: Per-NVLink-domain ring bandwidth
    long_description: Runs NCCL benchmarks separately within each NVLink domain (IMEX/NVLD racks) to measure intra-domain MNNVL bandwidth (GB/s), isolating a degraded domain without invalidating the rest of the cluster.
    platforms:
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: nccl-pairwise
    category: Network & Collectives
    description: Node-to-node latency check
    long_description: Runs NCCL benchmarks between node pairs to measure point-to-point bandwidth (GB/s) and latency, helping isolate degraded network links.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: slurm
        machine_type: a4x-maxgpu-4g-metal
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: stream
    category: Memory
    description: Memory bandwidth benchmark
    long_description: Measures sustainable GPU memory bandwidth (GB/s) using the STREAM benchmark to verify memory subsystem throughput.
    platforms:
      - scheduler: slurm
        machine_type: a3-ultragpu-8g
      - scheduler: slurm
        machine_type: a4-highgpu-8g
      - scheduler: slurm
        machine_type: a3-megagpu-8g
      - scheduler: slurm
        machine_type: a4x-highgpu-4g
      - scheduler: slurm
        machine_type: a4x-maxgpu-4g-metal
      - scheduler: kubernetes
        machine_type: a3-ultragpu-8g
      - scheduler: kubernetes
        machine_type: a4-highgpu-8g
      - scheduler: kubernetes
        machine_type: a3-megagpu-8g
      - scheduler: kubernetes
        machine_type: a4x-highgpu-4g
      - scheduler: kubernetes
        machine_type: a4x-maxgpu-4g-metal
  - name: tpu-info
    category: Host
    description: Basic TPU health and information
    long_description: Basic TPU health covering device count, libtpu version and tpu device type.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
      - scheduler: slurm
        machine_type: ct6e-standard-4t
  - name: tpu-gemm
    category: Compute
    description: General Matrix Multiply benchmark
    long_description: Performs generalized matrix multiplications (GEMM) through the TPU to calculate exactly how many peak TFLOP/s the compute pipeline can sustain.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
      - scheduler: slurm
        machine_type: ct6e-standard-4t
  - name: tpu-hbm
    category: Memory
    description: High Bandwidth Memory test
    long_description: Generates performance traces to measure the absolute architectural read and write bandwidth limits of the HBM.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
      - scheduler: slurm
        machine_type: ct6e-standard-4t
  - name: tpu-host-device
    category: Host
    description: Host to device bandwidth check
    long_description: Measures the pure transfer latency and maximum bandwidth capability by repeatedly bouncing bulk data payloads tightly between the Host CPU and the TPU.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
      - scheduler: slurm
        machine_type: ct6e-standard-4t
  - name: tpu-collectives
    category: Network & Collectives
    description: Cluster collectives testing
    long_description: Times distributed cross-chip operations (like All-Reduce and All-Gather) to measure the real-world bandwidth limits of the interconnect infrastructure.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
  - name: tpu-network-stress
    category: Network & Collectives
    description: Intense point-to-point network stress test for TPU interconnects
    long_description: Continuously swaps massive random payloads across the TPU high-speed interconnect (ICI) links to measure peak sustained network bandwidth and validate health against bit-flips.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
  - name: tpu-compute-stress
    category: Compute
    description: Maximum matrix multiplication stress test for TPU compute cores
    long_description: Maximizes the TPU's core math engines with intense, sustained matrix multiplications to verify system-level computational stability and expose any silent data corruption.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
  - name: tpu-hbm-stress
    category: Memory
    description: Heavy synthetic load testing High Bandwidth Memory (HBM) stability
    long_description: Checks the bottlenecks of the High Bandwidth Memory (HBM) using rapid integer operations to strictly measure maximum memory bandwidth and validate data integrity.
    platforms:
      - scheduler: kubernetes
        machine_type: tpu7x-standard-4t
      - scheduler: kubernetes
        machine_type: ct6e-standard-4t
