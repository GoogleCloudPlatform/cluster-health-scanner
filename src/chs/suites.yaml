suites:
- name: lite
  est_time: "~5 mins"
  description: "Quick health check (eg. nvidia-smi, dcgm, gemm)."
  deadline: 600
  tests:
  - name: nvidia-smi
  - name: dcgm
    variables:
      diag_level: [2]
  - name: gemm
    workloads: [check]
    variables:
      timeout: 180
  - name: nccl-single-node
    workloads: [all-gather, all-reduce]
    variables:
      begin_message_size: 256M
      end_message_size: 8G
  - name: tpu-info
    variables:
      timeout: 120
  - name: hbm
    variables:
      timeout: 300
  - name: tpu-collectives
    workloads: [psum]
    variables:
      timeout: 240
      message_size_start: 4096
      message_size_end: 16384
      message_size_multiplier: 2
- name: standard
  est_time: "~30 mins"
  description: "Thorough network & collective testing (eg. nccl, collectives)."
  deadline: 2400
  tests:
  - name: nvidia-smi
  - name: dcgm
    variables:
      diag_level: [3]
  - name: stream
  - name: nccl-cluster
    workloads: [all-gather, all-reduce, all-to-all]
    variables:
      begin_message_size: 256M
      end_message_size: 8G
  - name: nccl-pairwise
    workloads: [all-gather, all-reduce, all-to-all]
    variables:
      begin_message_size: 256M
      end_message_size: 8G
  - name: tpu-info
    variables:
      timeout: 120
  - name: hbm
    variables:
      timeout: 300
  - name: gemm
    variables:
      timeout: 180
  - name: host-device
    variables:
      timeout: 600
  - name: tpu-collectives
    workloads: [psum]
    variables:
      timeout: 240
  - name: tpu-network-diagnostics
    variables:
      timeout: 360
    trigger_condition:
      DEGRADED: [tpu-collectives]
      ERROR: [tpu-collectives]
